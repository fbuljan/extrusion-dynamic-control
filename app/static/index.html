<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extrusion Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css?v=0.6.5">
</head>
<body class="console-page">
<header class="topbar">
  <div class="brand"><span class="silk">DEMEX</span> Extrusion Monitor <span id="version" class="ver"></span></div>
  <nav class="tabs" aria-label="Pages">
    <a href="./" aria-current="page">Console</a><a href="test.html">Test bench</a><a href="monitor.html">Graphs &amp; topics</a>
  </nav>
  <div class="leds">
    <span id="st-reader" class="led" data-state="off">reader</span>
    <span id="st-writer" class="led" data-state="off">writer</span>
    <span id="st-model" class="led" data-state="off">models</span>
    <span id="st-gateway" class="led" data-state="off">gateway</span>
  </div>
  <span id="program" class="program" title="Active print program"></span>
  <button class="btn" id="open-settings">Settings</button>
</header>

<section class="bridge bridge-ctl" id="bridge-ctl" aria-label="Bead width and target">
  <div class="readout" id="r-width">
    <span class="silk">Width</span><span class="value">—</span>
    <span class="sub"><span id="conf-led" class="led" data-state="off" hidden></span><span id="width-note">no estimate</span></span>
  </div>
  <div class="readout" id="r-target">
    <span class="silk">Target</span>
    <span class="value target-row">
      <input id="target" type="number" step="0.01" inputmode="decimal" aria-label="Target width in millimetres, empty for none">
      <small>mm</small>
      <button class="btn" id="hold" type="button" aria-label="Hold current width as target" title="Target := current width">Hold</button>
    </span>
    <span class="sub" id="target-sub" role="status"></span>
  </div>
  <div class="readout" id="r-delta">
    <span class="silk">Δ to target</span><span class="value">—</span><span class="sub"></span>
  </div>
</section>

<section class="bridge" id="bridge" aria-label="Live process readouts"></section>

<main class="console" id="console">
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <figure class="cam" id="cam-ir" data-kind="ir">
        <img id="ir" alt="Thermal camera, raw">
        <figcaption id="ir-label" class="tally" data-state="none">IR · waiting</figcaption>
        <span id="ir-empty" class="empty">Waiting for IR frames from the trailing camera.</span>
      </figure>
    </div>
  </section>

  <div class="splitter" id="rack-splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize control rack"></div>

  <aside class="rack">
    <section class="ctl" id="ctl" aria-label="Width controller" data-link="offline">
      <div class="rack-head">
        <span class="silk">Controller</span>
        <span id="send-led" class="led" data-state="off">sends ?</span>
      </div>
      <div class="ctl-main">
        <button class="arm" id="auto" type="button" role="switch" aria-checked="false" aria-label="Auto control" disabled>
          <span class="silk">Auto</span></button>
        <span id="auto-led" class="led" data-state="off">—</span>
      </div>
      <div class="decision" id="decision"></div>
      <details class="why" id="why" hidden>
        <summary>Why</summary>
        <div id="why-body"></div>
      </details>
      <div id="ctl-msg" class="send-msg" role="status"></div>
      <div id="ctl-warn" class="send-msg" role="status"></div>
    </section>
    <div class="rack-head">
      <span class="silk">Corrections</span>
      <span id="write-led" class="led" data-state="off">write</span>
    </div>
    <div class="strips" id="strips"></div>
    <div id="send-msg" class="send-msg" role="status"></div>
    <details class="raw">
      <summary>Raw request <span class="muted">sent as-is, no checks</span></summary>
      <div class="muted mono raw-topic" id="req-topic"></div>
      <textarea id="raw" spellcheck="false"></textarea>
      <div class="raw-actions">
        <button class="btn" id="raw-template" title="Built from the latest gate status; it expires about 1.5 s later">New template</button>
        <button class="btn" id="raw-send">Send raw</button></div>
    </details>
    <div class="log-head"><span class="silk">Log</span><span id="writer-status" class="muted mono"></span></div>
    <ul class="log" id="log"></ul>
  </aside>
</main>

<dialog id="settings">
  <form>
    <h3>Broker settings</h3>
    <label>Host <input name="host"></label>
    <label>Port <input name="port" type="number"></label>
    <label>Reader user <input name="reader_user"></label>
    <label>Reader password <input name="reader_password" type="password" autocomplete="off"></label>
    <label>Writer user <input name="writer_user"></label>
    <label>Writer password <input name="writer_password" type="password" autocomplete="off"></label>
    <label>Controller ID (from LEAM's command guide) <input name="controller_id"></label>
    <div class="actions"><button class="btn" type="button" id="close-settings">Cancel</button>
      <button class="btn primary" type="submit">Save &amp; reconnect</button></div>
  </form>
</dialog>

<script src="common.js?v=0.6.5"></script>
<script src="main.js?v=0.6.5"></script>
</body>
</html>
