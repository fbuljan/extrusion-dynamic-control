version: '2.4'
services:
  hello-edge:
    image: hello-edge:${APP_VERSION}
    mem_limit: 512m
    restart: unless-stopped
    # Dashboard on the device's own address, reachable without the device UI login.
    ports:
      - "18081:8000"
    # Passwords are entered in the app's settings at runtime and kept here, never in the .app.
    volumes:
      - ./cfg-data/:/cfg-data/
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USER: ${MQTT_USER}
      MQTT_WRITER_USER: ${MQTT_WRITER_USER}
      MQTT_CONTROLLER_ID: ${MQTT_CONTROLLER_ID}
      # Slicing of the part being printed, for the width controller's layer count and printer model.
      FIRST_LAYER_MM: ${FIRST_LAYER_MM:-0.7}
      LAYER_MM: ${LAYER_MM:-0.5}
      LINE_WIDTH_MM: ${LINE_WIDTH_MM:-1.5}
      # Second key for Auto sends: only "1" lets the controller send; set it in the shell for that one build.
      CONTROL_SEND_ENABLED: ${CONTROL_SEND_ENABLED:-0}
      # Seconds Auto leaves an operator's change alone (controller default 300, floor 60).
      CONTROL_PIN_S: ${CONTROL_PIN_S:-300}
      # First layer Auto may act on (controller default 6).
      CONTROL_MIN_LAYER: ${CONTROL_MIN_LAYER:-6}
      # Step multiple Auto may take below 1.30 mm when widening (controller default 1.0, at most 2.0; D48).
      CONTROL_FLOOR_STEP_FACTOR: ${CONTROL_FLOOR_STEP_FACTOR:-1.0}
      # How long and over how many estimates a deviation must last before Auto acts (controller default 10 s / 5), and
      # the share of the gap one command aims to close (default 0.5); D51.
      CONTROL_PERSIST_S: ${CONTROL_PERSIST_S:-10}
      CONTROL_PERSIST_ESTIMATES: ${CONTROL_PERSIST_ESTIMATES:-5}
      CONTROL_KAPPA: ${CONTROL_KAPPA:-0.5}
      # Walls limit: below it the alarm shows and Auto's floor rules act (controller default 1.30); D52.
      CONTROL_MIN_WIDTH_MM: ${CONTROL_MIN_WIDTH_MM:-1.30}
      # Lever bounds for Auto, inside LEAM's ranges (default: LEAM's own; the Test bench can narrow them further); D54.
      CONTROL_FLOW_MIN: ${CONTROL_FLOW_MIN:-0}
      CONTROL_FLOW_MAX: ${CONTROL_FLOW_MAX:-200}
      CONTROL_SPEED_MIN: ${CONTROL_SPEED_MIN:-10}
      CONTROL_SPEED_MAX: ${CONTROL_SPEED_MAX:-200}
      CONTROL_NOZZLE_MIN: ${CONTROL_NOZZLE_MIN:-190}
      CONTROL_NOZZLE_MAX: ${CONTROL_NOZZLE_MAX:-250}
      # Averaging window of the displayed width in s (the controller keeps its own 25 s); D51.
      DISPLAY_WINDOW_S: ${DISPLAY_WINDOW_S:-15}
      # Safety margin in mm (0-0.5): every width reads this much narrower, so Auto keeps the real bead this much wider; D55.
      WIDTH_MARGIN_MM: ${WIDTH_MARGIN_MM:-0}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
